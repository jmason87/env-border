<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Popup</title>
    <link rel="stylesheet" href="popup.css">
</head>
<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Env Border</title>
        <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="card">
        <header class="card-header">
            <h1>Env Border</h1>
            <div id="extStatus" class="status-pill">Disabled</div>
        </header>

        <form id="envForm">
            <label class="input-label">Local Domain
                <div class="input-prefix"><span>http://</span><input type="text" id="local" placeholder="local.example.com"></div>
            </label>

            <label class="input-label">Testing/QA Domain
                <div class="input-prefix"><span>https://</span><input type="text" id="qe" placeholder="qa.example.com"></div>
            </label>

            <label class="input-label">Staging Domain
                <div class="input-prefix"><span>https://</span><input type="text" id="staging" placeholder="staging.example.com"></div>
            </label>

            <label class="input-label">Prod Domain
                <div class="input-prefix"><span>https://</span><input type="text" id="prod" placeholder="example.com"></div>
            </label>

            <div class="actions">
                <button type="button" id="toggleBtn" class="btn toggle">Enable Extension</button>
                <button type="button" id="saveBtn" class="btn primary">Save</button>
            </div>

            <div id="saveStatus" class="save-status" aria-live="polite" hidden>Saved ✓</div>
        </form>
    </div>

    <script src="popup.js"></script>
</body>
</html>
